extensions:
  health_check:

receivers:
  otlp:
    protocols:
      grpc:
      http:

  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
        metrics:
          system.cpu.time:
            enabled: false
          system.cpu.utilization:
            enabled: true
      load:
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      paging:
        metrics:
          system.paging.utilization:
            enabled: false
          system.paging.faults:
            enabled: false
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      disk:
        metrics:
          system.disk.merged:
            enabled: false
          system.disk.pending_operations:
            enabled: false
          system.disk.weighted_io_time:
            enabled: false
      network:
        metrics:
          system.network.connections:
            enabled: false

  filelog:
    include:
      - /var/log/alternatives.log
      - /var/log/cloud-init.log
      - /var/log/auth.log
      - /var/log/dpkg.log
      - /var/log/syslog
      - /var/log/messages
      - /var/log/secure
      - /var/log/yum.log

  nrsqlserver:
    collection_interval: 60s
    server: "mssql-0"
    port: 1433
    username: "newrelic"
    password: ${env:MSSQL_NEWRELIC_PASSWORD}
    metrics:
      # Database
      sqlserver.database.count:
        enabled: true
      sqlserver.database.file.size:
        enabled: true
      sqlserver.database.io:
        enabled: true
      sqlserver.database.latency:
        enabled: true
      sqlserver.database.operations:
        enabled: true
      sqlserver.database.page_file.size:
        enabled: true
      sqlserver.database.transactions.active:
        enabled: true
      sqlserver.database.backup_or_restore.rate:
        enabled: true
      sqlserver.database.execution.errors:
        enabled: true
      sqlserver.database.full_scan.rate:
        enabled: true
      sqlserver.database.tempdb.space:
        enabled: true
      sqlserver.database.tempdb.version_store.size:
        enabled: true
      # Security / Principals
      # NOTE: sqlserver.database.principals.{count,old,orphaned_users,recently_created},
      # sqlserver.database.role.{members.count,memberships.count,permission.risk_level,roles.count},
      # sqlserver.database.security.role_membership.count, and
      # sqlserver.server.security.{principal.count,role_membership.count} existed in
      # nrsqlserverreceiver v0.156.1 (what `events` runs) but were removed by v0.157.2
      # (bundled in nrdot-collector-releases 2.0.0, "latest" as of this fix) with no
      # replacement — confirmed via metadata.yaml diff, not just a rename. Dropped here
      # rather than left in to crash the receiver on startup.
      # Locks
      # NOTE: sqlserver.lock.by_mode.count / sqlserver.lock.by_resource.count — same as
      # above, removed in v0.157.2 with no replacement.
      sqlserver.lock.timeout.rate:
        enabled: true
      sqlserver.lock.wait.count:
        enabled: true
      sqlserver.lock.wait.rate:
        enabled: true
      sqlserver.deadlock.rate:
        enabled: true
      # Transactions
      sqlserver.transaction.delay:
        enabled: true
      sqlserver.transaction.mirror_write.rate:
        enabled: true
      sqlserver.transaction.longest_running_time:
        enabled: true
      sqlserver.transaction.version_cleanup.rate:
        enabled: true
      sqlserver.transaction.version_generation.rate:
        enabled: true
      # Memory
      sqlserver.memory.area:
        enabled: true
      sqlserver.memory.cache.object.count:
        enabled: true
      sqlserver.memory.grants.pending.count:
        enabled: true
      sqlserver.memory.page.count:
        enabled: true
      # sqlserver.memory.target removed in v0.157.2 as a duplicate of
      # sqlserver.memory.area{memory.pool="target"} (already enabled above).
      sqlserver.memory.usage:
        enabled: true
      # OS
      sqlserver.os.disk.size:
        enabled: true
      sqlserver.os.memory.usage:
        enabled: true
      sqlserver.os.memory.utilization:
        enabled: true
      sqlserver.os.scheduler.runnable_tasks.count:
        enabled: true
      sqlserver.os.wait.duration:
        enabled: true
      sqlserver.os.wait.tasks.count:
        enabled: true
      # Pages / Buffer
      sqlserver.page.buffer_cache.hit_ratio:
        enabled: true
      sqlserver.page.buffer_cache.free_list.stalls.rate:
        enabled: true
      sqlserver.page.life_expectancy:
        enabled: true
      sqlserver.page.lookup.rate:
        enabled: true
      # Batch / Compilation
      sqlserver.batch.request.rate:
        enabled: true
      sqlserver.batch.sql_compilation.rate:
        enabled: true
      sqlserver.batch.sql_recompilation.rate:
        enabled: true
      sqlserver.batch.compilation.utilization:
        enabled: true
      sqlserver.batch.page_split.utilization:
        enabled: true
      sqlserver.recompilation.ratio:
        enabled: true
      sqlserver.parameterization.rate:
        enabled: true
      sqlserver.plan.execution.rate:
        enabled: true
      sqlserver.attention.rate:
        enabled: true
      # Processes / Connections
      sqlserver.process.count:
        enabled: true
      sqlserver.processes.blocked:
        enabled: true
      sqlserver.user.connection.count:
        enabled: true
      sqlserver.login.rate:
        enabled: true
      sqlserver.logout.rate:
        enabled: true
      # Thread Pool
      sqlserver.thread_pool.tasks.count:
        enabled: true
      sqlserver.thread_pool.workers.count:
        enabled: true
      sqlserver.thread_pool.workers.max:
        enabled: true
      sqlserver.thread_pool.workers.utilization:
        enabled: true
      # TempDB
      sqlserver.tempdb.allocation.wait_time.total:
        enabled: true
      sqlserver.tempdb.contention.waiters.count:
        enabled: true
      sqlserver.tempdb.data_files.count:
        enabled: true
      sqlserver.tempdb.file.size:
        enabled: true
      sqlserver.tempdb.space.usage:
        enabled: true
      # Latch
      sqlserver.latch.superlatch.count:
        enabled: true
      sqlserver.latch.superlatch.transition.rate:
        enabled: true
      sqlserver.latch.wait.rate:
        enabled: true
      sqlserver.latch.wait_time.avg:
        enabled: true
      sqlserver.latch.wait_time.total:
        enabled: true
      # Index
      sqlserver.index.search.rate:
        enabled: true
      # Resource Pool
      sqlserver.resource_pool.disk.operations:
        enabled: true
      sqlserver.resource_pool.disk.throttled.read.rate:
        enabled: true
      sqlserver.resource_pool.disk.throttled.write.rate:
        enabled: true
      # Replica / Always-On
      sqlserver.replica.data.rate:
        enabled: true
      sqlserver.failover_cluster.ag.cluster_type:
        enabled: true
      sqlserver.failover_cluster.ag.failure_condition_level:
        enabled: true
      sqlserver.failover_cluster.ag.health_check_timeout:
        enabled: true
      sqlserver.failover_cluster.ag.required_sync_secondaries:
        enabled: true
      sqlserver.failover_cluster.replica.database.queue_size:
        enabled: true
      sqlserver.failover_cluster.replica.database.redo.rate:
        enabled: true
      sqlserver.failover_cluster.replica.flow_control_time:
        enabled: true
      sqlserver.failover_cluster.replica.role:
        enabled: true
      sqlserver.failover_cluster.replica.synchronization_health:
        enabled: true
      # Server Properties
      sqlserver.computer.uptime:
        enabled: true
      sqlserver.cpu.count:
        enabled: true
      # Tables
      sqlserver.table.count:
        enabled: true
      # Errors
      # sqlserver.kill_connection.error.rate removed in v0.157.2, replaced by
      # sqlserver.error.rate (defaults disabled there) filtered to
      # sqlserver.error.category="kill_connection" — enable that instead.
      sqlserver.error.rate:
        enabled: true
    events:
      db.server.query_sample:
        enabled: true
      db.server.top_query:
        enabled: true
    top_query_collection:
      lookback_time: 60s
      max_query_sample_count: 1000
      top_query_count: 250
      collection_interval: 60s
    collect_full_query_text: true
    allowed_comment_keys:
      - nr_service_guid
    query_sample_collection:
      max_rows_per_query: 100

processors:
  metricstransform:
    transforms:
      - include: system.cpu.utilization
        action: update
        operations:
          - action: aggregate_labels
            label_set: [ state ]
            aggregation_type: mean
      - include: system.paging.operations
        action: update
        operations:
          - action: aggregate_labels
            label_set: [ direction ]
            aggregation_type: sum

  filter/exclude_cpu_utilization:
    metrics:
      datapoint:
        - 'metric.name == "system.cpu.utilization" and attributes["state"] == "interrupt"'
        - 'metric.name == "system.cpu.utilization" and attributes["state"] == "nice"'
        - 'metric.name == "system.cpu.utilization" and attributes["state"] == "softirq"'

  filter/exclude_memory_utilization:
    metrics:
      datapoint:
        - 'metric.name == "system.memory.utilization" and attributes["state"] == "slab_unreclaimable"'
        - 'metric.name == "system.memory.utilization" and attributes["state"] == "inactive"'
        - 'metric.name == "system.memory.utilization" and attributes["state"] == "cached"'
        - 'metric.name == "system.memory.utilization" and attributes["state"] == "buffered"'
        - 'metric.name == "system.memory.utilization" and attributes["state"] == "slab_reclaimable"'

  filter/exclude_memory_usage:
    metrics:
      datapoint:
        - 'metric.name == "system.memory.usage" and attributes["state"] == "slab_unreclaimable"'
        - 'metric.name == "system.memory.usage" and attributes["state"] == "inactive"'

  filter/exclude_filesystem_utilization:
    metrics:
      datapoint:
        - 'metric.name == "system.filesystem.utilization" and attributes["type"] == "squashfs"'

  filter/exclude_filesystem_usage:
    metrics:
      datapoint:
        - 'metric.name == "system.filesystem.usage" and attributes["type"] == "squashfs"'
        - 'metric.name == "system.filesystem.usage" and attributes["state"] == "reserved"'

  filter/exclude_filesystem_inodes_usage:
    metrics:
      datapoint:
        - 'metric.name == "system.filesystem.inodes.usage" and attributes["type"] == "squashfs"'
        - 'metric.name == "system.filesystem.inodes.usage" and attributes["state"] == "reserved"'

  filter/exclude_system_disk:
    metrics:
      datapoint:
        - 'metric.name == "system.disk.operations" and IsMatch(attributes["device"], "^loop.*") == true'
        - 'metric.name == "system.disk.merged" and IsMatch(attributes["device"], "^loop.*") == true'
        - 'metric.name == "system.disk.io" and IsMatch(attributes["device"], "^loop.*") == true'
        - 'metric.name == "system.disk.io_time" and IsMatch(attributes["device"], "^loop.*") == true'
        - 'metric.name == "system.disk.operation_time" and IsMatch(attributes["device"], "^loop.*") == true'

  filter/exclude_system_paging:
    metrics:
      datapoint:
        - 'metric.name == "system.paging.usage" and attributes["state"] == "cached"'
        - 'metric.name == "system.paging.operations" and attributes["type"] == "cached"'

  filter/exclude_network:
    metrics:
      datapoint:
        - 'IsMatch(metric.name, "^system.network.*") == true and attributes["device"] == "lo"'

  attributes/exclude_system_paging:
    include:
      match_type: strict
      metric_names:
        - system.paging.operations
    actions:
      - key: type
        action: delete

  transform/clear_metadata:
    metric_statements:
      - context: metric
        statements:
          - set(metric.description, "")
          - set(metric.unit, "")

  transform/host:
    metric_statements:
      - context: metric
        statements:
          - set(metric.description, "")
          - set(metric.unit, "")

  transform:
    trace_statements:
      - context: span
        statements:
          - truncate_all(span.attributes, 4095)
          - truncate_all(resource.attributes, 4095)
    log_statements:
      - context: log
        statements:
          - truncate_all(log.attributes, 4095)
          - truncate_all(resource.attributes, 4095)

  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:NEW_RELIC_MEMORY_LIMIT_MIB:-1000}

  batch:

  resourcedetection:
    detectors: ["system"]
    system:
      hostname_sources: ["os"]
      resource_attributes:
        host.id:
          enabled: true

  resourcedetection/db_safe:
    detectors: ["system"]
    override: false
    system:
      hostname_sources: ["os"]
      resource_attributes:
        host.id:
          enabled: true

  resourcedetection/cloud:
    detectors: ["gcp", "ec2", "azure"]
    timeout: 2s
    override: true

  resourcedetection/env:
    detectors: ["env"]
    timeout: 2s
    override: true

  resource/mssql_identity:
    attributes:
      - key: host.name
        value: "mssql-0-${env:RELIBANK_ENVIRONMENT}"
        action: upsert
      - key: host.id
        value: "mssql-0-${env:RELIBANK_ENVIRONMENT}"
        action: upsert

exporters:
  otlphttp:
    endpoint: ${env:NEW_RELIC_OTLP_ENDPOINT}
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}
    compression: gzip
  debug:
    verbosity: detailed

service:
  pipelines:
    metrics/host:
      receivers: [hostmetrics]
      processors:
        - memory_limiter
        - metricstransform
        - filter/exclude_cpu_utilization
        - filter/exclude_memory_utilization
        - filter/exclude_memory_usage
        - filter/exclude_filesystem_utilization
        - filter/exclude_filesystem_usage
        - filter/exclude_filesystem_inodes_usage
        - filter/exclude_system_disk
        - filter/exclude_network
        - attributes/exclude_system_paging
        - transform/host
        - resourcedetection
        - resourcedetection/cloud
        - resourcedetection/db_safe
        - resourcedetection/env
        - batch
      exporters: [otlphttp]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform, resourcedetection, resourcedetection/cloud, resourcedetection/env, batch]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform, resourcedetection, resourcedetection/cloud, resourcedetection/env, batch]
      exporters: [otlphttp]
    metrics/mssql:
      receivers: [nrsqlserver]
      processors: [memory_limiter, transform, resourcedetection, resourcedetection/env, resource/mssql_identity, batch]
      exporters: [otlphttp, debug]
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, transform, resourcedetection, resourcedetection/db_safe, resourcedetection/env, batch]
      exporters: [otlphttp]
    logs/mssql:
      receivers: [nrsqlserver]
      processors: [memory_limiter, resourcedetection, resourcedetection/env, resource/mssql_identity, batch]
      exporters: [otlphttp]
  extensions: [health_check]
  telemetry:
    logs:
      level: debug
    metrics:
      level: none
