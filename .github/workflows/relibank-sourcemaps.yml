name: ReliBank Upload Source Maps

run-name: Upload source maps for ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        type: choice
        required: true
        default: "sandbox"
        options:
          - sandbox
          - staging
          - prod
          - analysts
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment to use for NR/host vars"
        type: string
        required: true

jobs:
  upload-sourcemaps:
    name: Upload source maps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Upload source maps to New Relic
        env:
          NEW_RELIC_USER_API_KEY:   ${{ secrets.NR_USER_API_KEY }}
          NEW_RELIC_BROWSER_APP_ID: ${{ vars.NR_BROWSER_APP_ID }}
          PUBLIC_HOST:              ${{ vars.PUBLIC_HOST }}
        run: python scripts/newrelic/upload_sourcemaps.py
