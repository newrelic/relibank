name: Flow - Memory Leak Scenario

on:
  workflow_dispatch:  # Allow manual trigger

  # schedule:
  # # Run once a day at 9am UTC
  # - cron: '0 9 * * *'

jobs:
  memory-leak:
    runs-on: ubuntu-latest
    environment: events

# --------------- runner setup ---------------
    steps:
      - name: Record start time
        id: start-time
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

# --------------- demo flow ---------------
      - name: Reset DEM memory leak scenarios
        run: |
          echo "Resetting DEM memory leak scenarios before starting..."
          curl -X POST "${{ vars.BASE_URL }}/scenario-runner/api/dem-memory-leak/reset" \
            --fail-with-body || {
              echo "Failed to reset DEM memory leak scenarios"
              exit 1
            }

      - name: Trigger 45-minute memory leak scenario (30-min climb + 15-min hold)
        run: |
          echo "Triggering DEM memory leak scenario (30 min climb + 15 min hold, payment failures included)..."
          curl -X POST "${{ vars.BASE_URL }}/scenario-runner/api/trigger_stress/dem-memory-leak-45min" \
            --fail-with-body || {
              echo "Failed to trigger DEM memory leak scenario"
              exit 1
            }

      - name: Verify scenario is active
        run: |
          echo "Verifying DEM memory leak scenario configuration..."
          response=$(curl -s "${{ vars.BASE_URL }}/scenario-runner/api/dem-memory-leak/config")
          echo "Response: $response"

          active=$(echo $response | jq -r '.config.memory_leak_trigger_active')

          if [ "$active" != "true" ]; then
            echo "ERROR: DEM memory leak trigger not active"
            exit 1
          fi

          echo "✓ DEM memory leak scenario active (payment failures enabled automatically)"

      - name: Wait for climb + hold (45 minutes)
        run: |
          echo "Memory will climb for ~30 minutes, then hold at cap for ~15 minutes..."
          echo "Monitor memory at: https://one.newrelic.com/"
          echo ""
          echo "NRQL Query to see memory climb:"
          echo "SELECT average(apm.service.memory.physical) as 'Avg Memory MB'"
          echo "FROM Metric"
          echo "WHERE appName = 'Relibank - Accounts Service'"
          echo "SINCE 45 minutes ago TIMESERIES 1 minute"
          echo ""
          echo "NRQL Query to see payment failure / revenue impact:"
          echo "SELECT count(*) as 'Failed Payments', sum(amount) as 'Revenue Lost (\$)'"
          echo "FROM PaymentDeclined, PaymentTimeout"
          echo "WHERE appName = 'Relibank - Bill Pay Service'"
          echo "SINCE 45 minutes ago TIMESERIES 1 minute"
          echo ""
          sleep 2700  # 45 minutes (30 min climb + 15 min hold)

      # - name: Create deployment marker (memory leak fix deployed)
      #   run: |
      #     python utils/scripts/new_relic/send_change_tracking_marker.py \
      #       --api-key ${{ secrets.NR_USER_API_KEY }} \
      #       --account-id ${{ vars.NR_ACCOUNT_ID }} \
      #       --app-name "Relibank - Accounts Service" \
      #       --entity-domain APM \
      #       --category DEPLOYMENT \
      #       --type ROLLING \
      #       --version "memory-leak-fix-$(date -u +%Y%m%d%H%M%S)" \
      #       --user devops_automation \
      #       --short-description "Fix deployed: accounts-service memory issue" \
      #       --description "Deployment corrects the unbounded cache growth in accounts-service. Memory allocated during the incident is released as the fix rolls out." \
      #       --custom-attribute environment=production

      - name: Reset DEM memory leak scenarios
        run: |
          echo "Resetting DEM memory leak scenario (simulates the fix deallocating memory)..."
          curl -X POST "${{ vars.BASE_URL }}/scenario-runner/api/dem-memory-leak/reset" \
            --fail-with-body || {
              echo "Warning: Failed to reset DEM memory leak scenario"
            }

      - name: Verify scenario is reset
        run: |
          echo "Verifying DEM memory leak scenario is disabled..."
          response=$(curl -s "${{ vars.BASE_URL }}/scenario-runner/api/dem-memory-leak/config")
          active=$(echo $response | jq -r '.config.memory_leak_trigger_active')

          if [ "$active" == "true" ]; then
            echo "WARNING: DEM memory leak trigger still active!"
            exit 1
          fi

          echo "✓ DEM memory leak scenario reset successfully"

      - name: Test Summary
        if: always()
        run: |
          echo "## Memory Leak Scenario Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration**: 45 minutes (30 min climb + 15 min hold)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: accounts-service, capped at ~800 MB" >> $GITHUB_STEP_SUMMARY
          echo "- **Side effects**: Payment failures auto-enabled (50% card decline, 20% gateway timeout)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Analysis" >> $GITHUB_STEP_SUMMARY
          echo "Review memory growth and business impact in New Relic:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### NRQL Queries" >> $GITHUB_STEP_SUMMARY
          echo '```sql' >> $GITHUB_STEP_SUMMARY
          echo 'SELECT average(apm.service.memory.physical) as "Avg Memory MB"' >> $GITHUB_STEP_SUMMARY
          echo 'FROM Metric' >> $GITHUB_STEP_SUMMARY
          echo "WHERE appName = 'Relibank - Accounts Service'" >> $GITHUB_STEP_SUMMARY
          echo 'SINCE 45 minutes ago TIMESERIES 1 minute' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '```sql' >> $GITHUB_STEP_SUMMARY
          echo 'SELECT count(*) as "Failed Payments", sum(amount) as "Revenue Lost ($)"' >> $GITHUB_STEP_SUMMARY
          echo 'FROM PaymentDeclined, PaymentTimeout' >> $GITHUB_STEP_SUMMARY
          echo "WHERE appName = 'Relibank - Bill Pay Service'" >> $GITHUB_STEP_SUMMARY
          echo 'SINCE 45 minutes ago TIMESERIES 1 minute' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Report scenario status to Krenko's Calendar
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          APP_NAME="${GITHUB_REPOSITORY##*/}"
          SCENARIO_NAME="${GITHUB_WORKFLOW#Flow - }"
          STARTED_AT="${{ steps.start-time.outputs.timestamp }}"
          COMPLETED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          HOUR=$(date -u +%Y-%m-%d-%H)

          # Determine status based on job outcome
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="completed"
          else
            STATUS="failed"
          fi

          cat > status.json <<EOF
          {
            "app": "$APP_NAME",
            "scenario": "$SCENARIO_NAME",
            "type": "scheduled",
            "status": "$STATUS",
            "started_at": "$STARTED_AT",
            "completed_at": "$COMPLETED_AT",
            "github_run_id": "${{ github.run_id }}",
            "github_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

          aws s3 cp status.json "s3://goblin-swarm-status-${ACCOUNT_ID}/scenarios/${APP_NAME}/${SCENARIO_NAME}/${HOUR}.json" || true
