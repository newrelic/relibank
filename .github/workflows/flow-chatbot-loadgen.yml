name: Flow - Support Loadgen

run-name: Create Scheduled Support Loadgen

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment ('all' matches the scheduled sweep)"
        type: choice
        required: true
        default: all
        options:
          - all
          - events
          - sandbox
          - staging
          - prod
      force_problem:
        description: "Force a toxic/adversarial query from problem_questions.txt"
        type: boolean
        required: false
        default: false

  schedule:
  - cron: "*/30 * * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

  resolve-environments:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set.outputs.environments }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.environment }}" != "all" ]; then
            echo 'environments=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'environments=["events","sandbox","staging","prod"]' >> "$GITHUB_OUTPUT"
          fi

  support-loadgen:
    needs: resolve-environments
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.resolve-environments.outputs.environments) }}

    environment: ${{ matrix.environment }}
    
# --------------- runner setup ---------------
    steps:
      - name: Record start time
        id: start-time
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: pip installs
        run: |
          pip install locust

# --------------- demo flow ---------------

      - name: Determine force-problem flag
        id: force-problem
        run: |
          # Manual runs can force it explicitly via input. Scheduled runs (and manual runs that
          # don't force it) guarantee a problem question every 4th run, so adversarial prompts
          # show up on a predictable cadence rather than relying solely on the random mix.
          if [ "${{ inputs.force_problem }}" = "true" ] || [ $(( ${{ github.run_number }} % 4 )) -eq 0 ]; then
            echo "flag=--force-problem" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Send chat loadgen
        run: |
          cd demo_flows/support_loadgen/ && python create_support_loadgen.py ${{ vars.BASE_URL }}/support-service/chat ${{ steps.force-problem.outputs.flag }}

      - name: Report scenario status to Krenko's Calendar
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          APP_NAME="${GITHUB_REPOSITORY##*/}"
          SCENARIO_NAME="${GITHUB_WORKFLOW#Flow - }"
          STARTED_AT="${{ steps.start-time.outputs.timestamp }}"
          COMPLETED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          HOUR=$(date -u +%Y-%m-%d-%H)

          # Determine status based on job outcome
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="completed"
          else
            STATUS="failed"
          fi

          cat > status.json <<EOF
          {
            "app": "$APP_NAME",
            "scenario": "$SCENARIO_NAME",
            "type": "scheduled",
            "status": "$STATUS",
            "started_at": "$STARTED_AT",
            "completed_at": "$COMPLETED_AT",
            "github_run_id": "${{ github.run_id }}",
            "github_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

          aws s3 cp status.json "s3://goblin-swarm-status-${ACCOUNT_ID}/scenarios/${APP_NAME}/${SCENARIO_NAME}/${HOUR}.json" || true
