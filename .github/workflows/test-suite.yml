name: Relibank Test Suite

on:
  schedule:
    # Run daily at 5 AM PST (6pm UTC)
    - cron: '0 13 * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      target_environment:
        description: 'GitHub environment to target (provides BASE_URL, NR keys, DB creds)'
        required: false
        default: 'events'
        type: choice
        options:
          - events
          - sandbox
          - staging
          - prod
          - analysts
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - e2e
          - scenario
          - payment
          - frontend
          - smoke
      target_color:
        description: 'Color to direct scenario-UI checks at (sends X-Test-Env). Empty = active color.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - blue
          - green
  workflow_call:
    inputs:
      target_environment:
        type: string
        required: true
      test_suite:
        type: string
        required: false
        default: 'all'
      target_color:
        type: string
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  python-tests:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || 'events' }}
    if: ${{ inputs.test_suite == 'all' || inputs.test_suite == 'e2e' || inputs.test_suite == 'scenario' || inputs.test_suite == 'payment' || inputs.test_suite == 'smoke' || inputs.test_suite == '' }}
    outputs:
      test_ab_testing: ${{ steps.individual-tests.outputs.test_ab_testing }}
      test_apm_user_tracking: ${{ steps.individual-tests.outputs.test_apm_user_tracking }}
      test_browser_user_tracking: ${{ steps.individual-tests.outputs.test_browser_user_tracking }}
      test_card_payment_transactions: ${{ steps.individual-tests.outputs.test_card_payment_transactions }}
      test_db_pool_e2e: ${{ steps.individual-tests.outputs.test_db_pool_e2e }}
      test_db_pool: ${{ steps.individual-tests.outputs.test_db_pool }}
      test_e2e: ${{ steps.individual-tests.outputs.test_e2e }}
      test_lcp_regression: ${{ steps.individual-tests.outputs.test_lcp_regression }}
      test_mfe_single: ${{ steps.individual-tests.outputs.test_mfe_single }}
      test_microfrontend_telemetry: ${{ steps.individual-tests.outputs.test_microfrontend_telemetry }}
      test_newrelic_instrumentation: ${{ steps.individual-tests.outputs.test_newrelic_instrumentation }}
      test_newrelic_risk_assessment: ${{ steps.individual-tests.outputs.test_newrelic_risk_assessment }}
      test_payment: ${{ steps.individual-tests.outputs.test_payment }}
      test_rogue_deployment: ${{ steps.individual-tests.outputs.test_rogue_deployment }}
      test_scenario: ${{ steps.individual-tests.outputs.test_scenario }}
      test_stress: ${{ steps.individual-tests.outputs.test_stress }}
      test_with_interactions: ${{ steps.individual-tests.outputs.test_with_interactions }}
      test_nrdot_mssql_collector: ${{ steps.individual-tests.outputs.test_nrdot_mssql_collector }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Reset chaos rate limit
        run: |
          echo "Resetting chaos rate limit before running tests..."
          curl -X POST "${{ vars.BASE_URL }}/scenario-runner/api/chaos-rate-limit-reset" || echo "Rate limit reset failed (may not be available)"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install ODBC Driver 18 for SQL Server
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - name: Verify Chrome and ChromeDriver for Selenium tests
        run: |
          # Google Chrome and ChromeDriver are pre-installed on ubuntu-latest runners.
          # chromium-browser on Ubuntu 24.04 is a snap stub and fails in CI (no snapd).
          google-chrome --version
          chromedriver --version

      - name: Install dependencies
        run: |
          cd tests
          pip install -r requirements.txt

      # Terraform-deployed envs deploy blue/green and keep MSSQL as a headless ClusterIP (no
      # public endpoint). Authenticate to AKS, resolve the color under test, and port-forward
      # THAT color's mssql to 127.0.0.1:1433 for the DB-direct tests. The resolved color is
      # exported as EFFECTIVE_COLOR so the HTTP tests route to it (X-Test-Env, via conftest) and
      # NR queries can filter by it. Skipped for legacy envs (events) with no AKS vars — those
      # are single-namespace (no color) and use their own DB_SERVER secret.
      - name: Azure Login (color-aware DB tunnel)
        if: ${{ vars.AKS_CLUSTER_NAME != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve effective color
        if: ${{ vars.AKS_CLUSTER_NAME != '' }}
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing
          # Directed color when provided (deploy/manual); else the ACTIVE color from
          # main-ingress (cron/no-input). blue-service|green-service -> blue|green.
          color="${{ inputs.target_color }}"
          if [ -z "$color" ]; then
            backend=$(kubectl get ingress main-ingress -n default \
              -o jsonpath='{.spec.rules[0].http.paths[0].backend.service.name}')
            color="${backend%-service}"
          fi
          echo "Effective color: ${color:-<none>}"
          echo "EFFECTIVE_COLOR=${color}" >> "$GITHUB_ENV"

      - name: Port-forward MSSQL (effective color)
        if: ${{ vars.AKS_CLUSTER_NAME != '' }}
        run: |
          kubectl port-forward -n "relibank-${EFFECTIVE_COLOR}" svc/mssql 1433:1433 >/tmp/mssql-pf.log 2>&1 &
          # Wait until 127.0.0.1:1433 accepts connections (~30s max)
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null && { echo "MSSQL tunnel up (relibank-${EFFECTIVE_COLOR})"; exec 3>&- ; break; }
            sleep 1
          done
          (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null || { echo "port-forward failed:"; cat /tmp/mssql-pf.log; exit 1; }

      - name: Run all Python tests individually
        if: ${{ inputs.test_suite == 'all' || inputs.test_suite == '' }}
        id: individual-tests
        timeout-minutes: 60
        env:
          RELIBANK_URL: ${{ vars.BASE_URL }}
          BASE_URL: ${{ vars.BASE_URL }}
          ACCOUNTS_SERVICE_URL: ${{ vars.BASE_URL }}
          AUTH_SERVICE_URL: ${{ vars.BASE_URL }}
          BILL_PAY_SERVICE_URL: ${{ vars.BASE_URL }}
          SUPPORT_SERVICE_URL: ${{ vars.BASE_URL }}
          TRANSACTION_SERVICE_URL: ${{ vars.BASE_URL }}
          SCENARIO_SERVICE_URL: ${{ vars.BASE_URL }}
          FRONTEND_SERVICE_URL: ${{ vars.BASE_URL }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NR_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NR_ACCOUNT_ID }}
          APP_NAME: ${{ vars.APP_NAME }}
          NR_BROWSER_APP_NAME: ${{ vars.NR_BROWSER_APP_NAME }}
          # Scenario-UI webpage test: direct at a color (X-Test-Env) + expected flag state,
          # threaded from the deploy so no manual sync. Empty color = active color.
          TARGET_COLOR: ${{ env.EFFECTIVE_COLOR || inputs.target_color }}
          SCENARIO_UI_ENABLED: ${{ inputs.target_environment == 'prod' && 'false' || 'true' }}
          # DB creds are convention-agnostic and mostly zero-config:
          #  - host: legacy events has a DB_SERVER secret (public LB) and it wins; Terraform envs
          #    have none, so tests hit 127.0.0.1 — the "Port-forward MSSQL" step below tunnels the
          #    active color's in-cluster (ClusterIP) DB to localhost:1433. No public exposure.
          #  - auth: reuse the MSSQL_SA_* secrets Terraform envs already have (events' DB_PASSWORD wins).
          DB_SERVER: ${{ secrets.DB_SERVER || '127.0.0.1' }}
          DB_USERNAME: ${{ secrets.DB_USERNAME || secrets.MSSQL_SA_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || secrets.MSSQL_SA_PASSWORD }}
        run: |
          cd tests

          # Discover all test files dynamically
          TEST_FILES=$(ls test_*.py 2>/dev/null || echo "")

          if [ -z "$TEST_FILES" ]; then
            echo "No test files found"
            exit 1
          fi

          # Run each test file individually and capture results
          for test_file in $TEST_FILES; do
            # Convert filename to output variable name
            # test_ab_testing_scenarios.py -> test_ab_testing
            test_name=$(echo "$test_file" | sed 's/test_\(.*\)_scenarios\.py/test_\1/' | sed 's/test_\(.*\)_service\.py/test_\1/' | sed 's/test_\(.*\)_tracking\.py/test_\1_tracking/' | sed 's/test_\(.*\)_instrumentation\.py/test_\1_instrumentation/' | sed 's/test_end_to_end\.py/test_e2e/' | sed 's/test_\(.*\)\.py/test_\1/')

            echo "Running $test_file..."
            if pytest "$test_file" --tb=line --timeout=300; then
              echo "${test_name}=passed" >> $GITHUB_OUTPUT
              echo "✓ $test_file passed"
            else
              echo "${test_name}=failed" >> $GITHUB_OUTPUT
              echo "✗ $test_file failed"
            fi
          done

      - name: Run end-to-end tests only
        if: ${{ inputs.test_suite == 'e2e' }}
        env:
          RELIBANK_URL: ${{ vars.BASE_URL }}
          BASE_URL: ${{ vars.BASE_URL }}
          ACCOUNTS_SERVICE_URL: ${{ vars.BASE_URL }}
          AUTH_SERVICE_URL: ${{ vars.BASE_URL }}
          BILL_PAY_SERVICE_URL: ${{ vars.BASE_URL }}
          SUPPORT_SERVICE_URL: ${{ vars.BASE_URL }}
          TRANSACTION_SERVICE_URL: ${{ vars.BASE_URL }}
          SCENARIO_SERVICE_URL: ${{ vars.BASE_URL }}
          FRONTEND_SERVICE_URL: ${{ vars.BASE_URL }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NR_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NR_ACCOUNT_ID }}
        run: |
          cd tests
          pytest test_end_to_end.py -n auto --tb=line

      - name: Run scenario service tests only
        if: ${{ inputs.test_suite == 'scenario' }}
        env:
          RELIBANK_URL: ${{ vars.BASE_URL }}
          SCENARIO_SERVICE_URL: ${{ vars.BASE_URL }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NR_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NR_ACCOUNT_ID }}
          # Scenario-UI webpage test: X-Test-Env color + expected flag (empty color = active)
          TARGET_COLOR: ${{ env.EFFECTIVE_COLOR || inputs.target_color }}
          SCENARIO_UI_ENABLED: ${{ inputs.target_environment == 'prod' && 'false' || 'true' }}
        run: |
          cd tests
          pytest test_scenario_service.py --tb=line

      - name: Run payment scenario tests only
        if: ${{ inputs.test_suite == 'payment' }}
        env:
          RELIBANK_URL: ${{ vars.BASE_URL }}
          SCENARIO_SERVICE_URL: ${{ vars.BASE_URL }}
          BILL_PAY_SERVICE_URL: ${{ vars.BASE_URL }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NR_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NR_ACCOUNT_ID }}
        run: |
          cd tests
          pytest test_payment_scenarios.py --tb=line

      - name: Run smoke tests only
        if: ${{ inputs.test_suite == 'smoke' }}
        env:
          RELIBANK_URL: ${{ vars.BASE_URL }}
          BASE_URL: ${{ vars.BASE_URL }}
          FRONTEND_SERVICE_URL: ${{ vars.BASE_URL }}
          SCENARIO_SERVICE_URL: ${{ vars.BASE_URL }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NR_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NR_ACCOUNT_ID }}
        run: |
          cd tests
          pytest test_end_to_end.py::test_frontend_loads test_scenario_service.py::test_scenario_service_health -n auto --tb=line

  frontend-tests:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || 'events' }}
    if: ${{ inputs.test_suite == 'all' || inputs.test_suite == 'frontend' || inputs.test_suite == '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend_service/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend_service
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend_service
          npm test

  test-summary:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || 'events' }}
    needs: [python-tests, frontend-tests]
    if: always()

    steps:
      - name: Test Results Summary
        run: |
          # Build summary from test outputs JSON
          TEST_OUTPUTS='${{ toJSON(needs.python-tests.outputs) }}'
          FRONTEND_RESULT="${{ needs.frontend-tests.result }}"

          # Count failures
          FAILURES=$(echo "$TEST_OUTPUTS" | python3 -c "
          import sys, json
          outputs = json.load(sys.stdin)
          failed = [k for k, v in outputs.items() if v == 'failed']
          print('\n'.join(failed))
          " 2>/dev/null || echo "")

          echo "## Relibank Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ vars.BASE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -z "$FAILURES" ] && [ "$FRONTEND_RESULT" == "success" ]; then
            echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Failures" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            while IFS= read -r key; do
              [ -n "$key" ] && echo "- $key" >> $GITHUB_STEP_SUMMARY
            done <<< "$FAILURES"
            [ "$FRONTEND_RESULT" != "success" ] && echo "- frontend-tests" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure AWS credentials
        if: always()
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-west-2' }}

      - name: Report test status to Krenko's Calendar
        if: always()
        continue-on-error: true
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          APP_NAME="${GITHUB_REPOSITORY##*/}"
          DATE=$(date -u +%Y-%m-%d)

          # Determine overall status
          if [ "${{ needs.python-tests.result }}" == "success" ] && [ "${{ needs.frontend-tests.result }}" == "success" ]; then
            STATUS="completed"
          else
            STATUS="failed"
          fi

          # Build test results array dynamically from outputs
          TEST_RESULTS=""

          # Map of output variable names to human-readable test names
          declare -A TEST_NAMES=(
            ["test_ab_testing"]="AB Testing Scenarios"
            ["test_apm_tracking"]="APM User Tracking"
            ["test_browser_tracking"]="Browser User Tracking"
            ["test_e2e"]="End to End"
            ["test_lcp_regression"]="LCP Regression"
            ["test_nr_instrumentation"]="New Relic Instrumentation"
            ["test_payment"]="Payment Scenarios"
            ["test_scenario"]="Scenario Service"
            ["test_stress"]="Stress Scenarios"
            ["test_microfrontend_telemetry"]="Microfrontend Telemetry"
          )

          # Get test outputs JSON once (outside loop)
          TEST_OUTPUTS='${{ toJSON(needs.python-tests.outputs) }}'

          # Check if outputs are empty or null
          if [ -z "$TEST_OUTPUTS" ] || [ "$TEST_OUTPUTS" = "null" ] || [ "$TEST_OUTPUTS" = "{}" ]; then
            echo "No test outputs found, all tests marked as skipped"
            TEST_OUTPUTS='{}'
          fi

          # Build test results JSON array
          for test_key in "${!TEST_NAMES[@]}"; do
            test_name="${TEST_NAMES[$test_key]}"

            # Extract status for this test from outputs JSON, with error handling
            status=$(echo "$TEST_OUTPUTS" | jq -r ".$test_key // \"skipped\"" 2>/dev/null || echo "skipped")

            if [ -n "$TEST_RESULTS" ]; then
              TEST_RESULTS="${TEST_RESULTS},"
            fi
            TEST_RESULTS="${TEST_RESULTS}{\"test_name\": \"$test_name\", \"status\": \"$status\"}"
          done

          # Add frontend tests
          FRONTEND_STATUS="${{ needs.frontend-tests.result == 'success' && 'passed' || 'failed' }}"
          TEST_RESULTS="${TEST_RESULTS},{\"test_name\": \"Frontend Tests\", \"status\": \"$FRONTEND_STATUS\"}"

          # Generate final JSON
          cat > test-status.json <<EOF
          {
            "app": "$APP_NAME",
            "date": "$DATE",
            "status": "$STATUS",
            "github_run_id": "${{ github.run_id }}",
            "github_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "test_results": [$TEST_RESULTS]
          }
          EOF

          # Rotate test results - keep latest 3
          aws s3 cp "s3://goblin-swarm-status-${ACCOUNT_ID}/tests/${APP_NAME}/latest-1.json" latest-2.json 2>/dev/null || true
          aws s3 cp "s3://goblin-swarm-status-${ACCOUNT_ID}/tests/${APP_NAME}/latest-2.json" latest-3.json 2>/dev/null || true
          [ -f latest-2.json ] && aws s3 cp latest-2.json "s3://goblin-swarm-status-${ACCOUNT_ID}/tests/${APP_NAME}/latest-2.json" || true
          [ -f latest-3.json ] && aws s3 cp latest-3.json "s3://goblin-swarm-status-${ACCOUNT_ID}/tests/${APP_NAME}/latest-3.json" || true

          # Upload new result as latest-1
          aws s3 cp test-status.json "s3://goblin-swarm-status-${ACCOUNT_ID}/tests/${APP_NAME}/latest-1.json" || true
