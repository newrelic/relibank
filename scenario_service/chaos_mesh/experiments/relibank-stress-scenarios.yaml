---
# Database Performance Matrix, Act 1: Resource Starvation (CPU half).
# Pegs the mssql container CPU (it is limited to 1 CPU, so it saturates and throttles).
# CPU only on purpose: the original also held 4 x 400MB of memory, but this container is limited
# to 2Gi while SQL Server may grow well past that, so memory stress risks an OOM kill of the DB.
# Pair with relibank-mssql-network-delay (NetworkChaos, in relibank-network-scenarios.yaml);
# same duration so they expire together.
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: relibank-mssql-resource-starvation
  namespace: relibank
  labels:
    app: relibank
    experiment-type: stress-chaos
    target-flow: mssql-resource-starvation
spec:
  mode: one
  selector:
    namespaces:
    - relibank
    labelSelectors:
      app: mssql
  containerNames:
  - mssql
  duration: 20m
  stressors:
    cpu:
      workers: 4
      load: 95
