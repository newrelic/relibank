---
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: relibank-cpu-stress-test
  namespace: relibank
  labels:
    app: relibank
    experiment-type: stress-chaos
    target-flow: cpu-stress
spec:
  mode: one
  selector:
    namespaces:
    - relibank
    labelSelectors:
      app: transaction-service
  duration: 22m
  stressors:
    cpu:
      workers: 4
      load: 80

